{% load duration %}


<div class="card card-audio">
    <a href="{% url 'videoplayer:audio_detail' a.pk %}" class="preview">
        {% if a.cover_path %}
            <img src="{{ MEDIA_URL }}{{ a.cover_path }}" alt="{{ a.title }}" loading="lazy">
        {% else %}
            <div class="no-preview">
                <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M9 18V5l12-2v13"/>
                    <circle cx="6" cy="18" r="3"/>
                    <circle cx="18" cy="16" r="3"/>
                </svg>
            </div>
        {% endif %}
    </a>
    <div class="meta">
        <div class="title">
            <h3><a href="{% url 'videoplayer:audio_detail' a.pk %}">{{ a.title }}</a></h3>
        </div>
        {% if v.duration %}
            <span class="duration-badge">{{ a.duration|duration }}</span>
        {% endif %}
        <div class="published">
            <small>{{ a.channel.name }}{% if a.playlist %} · {{ a.playlist.name }}{% endif %}</small>
            {% if a.recorded_at %}<small class="date">{{ a.recorded_at }}</small>{% endif %}
        </div>
    </div>
</div>
