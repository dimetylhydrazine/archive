{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/plyr_style.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/plyr/plyr.css' %}">
    <title>Архив</title>
</head>

<body>
    <div class="wrapper">
        <header class="header">
            <a href="{% url 'videoplayer:video_list' %}" class="logo">archive</a>

            <form method="get" action="{% url 'videoplayer:search' %}" class="search-form">
                <input type="search" name="q"
                    value="{{ request.GET.q|default:'' }}"
                    placeholder="поиск..."
                    autocomplete="off">
                <button type="submit" aria-label="Найти">
                    <svg width="16" height="16" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                </button>
            </form>
        </header>

        <nav class="nav">
            <a href="{% url 'videoplayer:video_list' %}"
            class="nav-block {% if request.resolver_match.url_name == 'video_list' or request.resolver_match.url_name == 'video_detail' %}active{% endif %}">
                <span>видео</span>
            </a>
            <a href="{% url 'videoplayer:channel_list' %}"
            class="nav-block {% if request.resolver_match.url_name == 'channel_list' or request.resolver_match.url_name == 'channel_detail' or request.resolver_match.url_name == 'playlist_detail' %}active{% endif %}">
                <span>каналы</span>
            </a>
            <a href="{% url 'videoplayer:audio_list' %}"
                class="nav-block {% if request.resolver_match.url_name == 'audio_list' or request.resolver_match.url_name == 'audio_detail' %}active{% endif %}">
                    <span>аудио</span>
            </a>

            {% if user.is_authenticated %}
                <div class="nav-right">
                    {% if user.is_staff %}
                        <a href="{% url 'admin:index' %}" class="nav-block nav-admin" target="_blank" rel="noopener">
                            <span>админка</span>
                        </a>
                    {% endif %}
                    <form method="post" action="{% url 'logout' %}" class="logout-form">
                        {% csrf_token %}
                        <button type="submit" class="nav-block">выйти</button>
                    </form>
                </div>
            {% else %}
                <a href="{% url 'login' %}" class="nav-block nav-right">войти</a>
            {% endif %}

            
        </nav>


        <main class="content">
            {% block content %}
            {% endblock content %}

        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const players = document.querySelectorAll('.js-player');
            players.forEach(function (el) {
                new Plyr(el, {
                    controls: [
                        'play-large', 'restart', 'rewind', 'play',
                        'fast-forward', 'progress', 'current-time', 'duration',
                        'mute', 'volume', 'settings', 'pip', 'airplay',
                        'download', 'fullscreen'
                    ],
                    settings: ['speed'],
                    speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2] },
                    keyboard: { focused: true, global: false },
                    tooltips: { controls: true, seek: true },
                    i18n: {
                        restart: 'Заново',
                        rewind: 'Назад {seektime} сек',
                        play: 'Играть',
                        pause: 'Пауза',
                        fastForward: 'Вперёд {seektime} сек',
                        seek: 'Перемотка',
                        played: 'Проиграно',
                        buffered: 'Буфер',
                        currentTime: 'Текущее время',
                        duration: 'Длительность',
                        volume: 'Громкость',
                        mute: 'Без звука',
                        unmute: 'Со звуком',
                        enterFullscreen: 'На весь экран',
                        exitFullscreen: 'Выйти из полноэкранного',
                        settings: 'Настройки',
                        speed: 'Скорость',
                        normal: 'Обычная',
                        quality: 'Качество',
                        loop: 'Повтор',
                        start: 'Начало',
                        end: 'Конец',
                        all: 'Все',
                        reset: 'Сброс',
                        disabled: 'Выкл',
                        enabled: 'Вкл',
                        advertisement: 'Реклама',
                        qualityBadge: {
                            2160: '4K',
                            1440: 'HD',
                            1080: 'HD',
                            720: 'HD',
                            576: 'SD',
                            480: 'SD',
                        },
                    },
                });
            });
        });
    </script>
</body>
</html>
