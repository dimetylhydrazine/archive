services:
  db:
    image: postgres:16
    container_name: archivedb
    restart: unless-stopped
    environment:
      POSTGRES_DB: archivedb
      POSTGRES_USER: ndmg
      POSTGRES_PASSWORD: marselina5$
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndmg -d archivedb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: